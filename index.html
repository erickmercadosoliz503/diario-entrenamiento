<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario de entrenamiento</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Diario de entrenamiento para entrenadores y clientes: plan, sesiones, récords y revisiones.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--accent:#5acae4;--bg:#e4e4e4;--card:#f1f1f1;--ink:#0a0a0a;--mute:#5c5c5c;--field:#dedede;--line:#c6c6c6;--head:#0a0a0a;--danger:#c62020;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto}
h1{margin:0;font:italic 700 clamp(19px,5vw,26px)/1 'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.tabs{display:flex;gap:6px;align-items:center;max-width:1100px;margin:8px auto 0}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:#aaa;font:600 14px 'Barlow',sans-serif;padding:4px 2px;margin-right:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.tab.on{color:#fff;border-color:var(--accent)}
.count{margin-left:auto;color:var(--accent);font-weight:600;font-size:14px}
.btn{background:var(--accent);color:#0a0a0a;border:0;border-radius:2px;font:600 15px 'Barlow',sans-serif;padding:9px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.btn:active{filter:brightness(.92)}
main{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
input,textarea{width:100%;font:500 16px 'Barlow',sans-serif;color:var(--ink);background:var(--field);border:1px solid transparent;border-radius:2px;padding:9px 10px;outline:none;box-shadow:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--accent)}
::placeholder{color:var(--mute);opacity:.7}
textarea{resize:vertical;min-height:44px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}
.exs{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.exs{grid-template-columns:1fr 1fr}.g4{max-width:560px}}
.ex{border:1px solid var(--line);background:var(--card);padding:12px;border-radius:2px}
.exn{font:600 19px 'Barlow',sans-serif;background:var(--field);margin-bottom:8px}
table{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;margin:0 -4px;width:calc(100% + 8px)}
th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:center;padding-bottom:2px}
td input{text-align:center;padding:8px 2px}
.sn{width:42px;text-align:center;font-weight:600;color:var(--mute);font-size:14px}
th.sn{font-size:11px}
.ex textarea{margin-top:6px;min-height:38px}
.concl{margin-top:18px}
.concl textarea{min-height:130px}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.del{background:none;border:0;color:var(--danger);font:500 14px 'Barlow',sans-serif;text-decoration:underline;cursor:pointer;padding:6px}
.list{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:2px;padding:12px 14px;cursor:pointer;font:inherit;display:block;width:100%}
.card:hover{border-color:var(--accent)}
.ct{display:flex;justify-content:space-between;gap:8px;font:italic 700 20px 'Barlow Condensed',sans-serif;text-transform:uppercase}
.ct span:last-child{color:var(--mute);font:600 15px 'Barlow',sans-serif;font-style:normal}
.ty{font-weight:600;margin:2px 0 6px}
.ch{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.ch i{font-style:normal;font-size:13px;background:var(--field);padding:2px 7px;border-radius:2px}
.ch i.more{background:var(--accent);color:#0a0a0a;font-weight:600}
.sm{color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.box{background:var(--card);padding:20px;border-radius:2px;max-width:340px;width:100%}
.box p{margin:0 0 16px;font-size:17px}
.box .r{display:flex;gap:10px;justify-content:flex-end}
.ghost{background:var(--field);color:var(--ink)}
.red{background:var(--danger);color:#fff}
.lrow{display:flex;gap:6px;margin-bottom:8px}
.lrow input{font-size:14px;padding:7px 9px}
.lk{display:flex;align-items:center;background:var(--accent);color:#0a0a0a;font-weight:600;font-size:13px;text-decoration:none;padding:0 10px;border-radius:2px;white-space:nowrap;text-transform:uppercase}
.lk[hidden]{display:none}
#login{max-width:1100px;margin:0 auto;padding:0 14px}
.lg{max-width:380px;margin:40px auto 0;border:1px solid var(--line);border-top:4px solid var(--accent);background:var(--card);padding:22px}
.lg h2{margin:0 0 4px;font:italic 700 28px 'Barlow Condensed',sans-serif;text-transform:uppercase}
.lsub{color:var(--mute);margin:0 0 16px}
.lmsg{min-height:20px;margin:10px 0;color:var(--danger);font-size:14px;font-weight:500}
.lbtns{display:flex;gap:10px}.lbtns .btn{flex:1}
.lnote{font-size:12px;color:var(--mute);margin:14px 0 0}
body.out .tabs,body.out #new{display:none}
select{width:100%;font:500 16px 'Barlow',sans-serif;color:var(--ink);background:var(--field);border:1px solid transparent;border-radius:2px;padding:9px 10px}
.sec{font:italic 700 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:22px 0 8px}
.mc{margin-bottom:12px}
.rr{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.rr span{flex:1;color:var(--mute);font-size:14px}
.rr b{font-weight:600}
.rr i{font-style:normal;color:var(--mute);font-size:12px;min-width:84px;text-align:right}
.rt{font:italic 700 20px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin-bottom:6px}
:root[data-theme="dark"]{--bg:#121212;--card:#1d1d1d;--ink:#f0f0f0;--mute:#9a9a9a;--field:#2b2b2b;--line:#363636;--danger:#ff5a5a;color-scheme:dark}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;background:var(--field);color:var(--ink);border:0;border-radius:2px;padding:9px;font:600 14px 'Barlow',sans-serif;text-transform:uppercase;cursor:pointer}
.seg button.on{background:var(--accent);color:#0a0a0a}
.g4m{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.g4m{grid-template-columns:repeat(4,1fr)}}
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pic{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--field);border-radius:2px;display:block}
.pic.none{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.pick{position:relative;overflow:hidden;display:block;text-align:center;margin-top:6px;color:var(--ink);font-size:13px;letter-spacing:.04em;cursor:pointer}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--field);color:var(--ink);border:0;border-radius:2px;padding:9px 12px;font:600 14px 'Barlow',sans-serif;cursor:pointer}
.chip.on{background:var(--accent);color:#0a0a0a}
.chip[disabled]{cursor:default;opacity:1;color:var(--ink)}
.chip.on[disabled]{color:#0a0a0a}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cw{display:flex;flex-direction:column;align-items:flex-end}
.x{background:none;border:0;color:var(--danger);font:600 20px/1 'Barlow',sans-serif;padding:0 4px;cursor:pointer}
.pv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute);margin:-2px 0 8px}
.pv b{color:var(--ink)}
.note{background:var(--field);border-left:4px solid var(--accent);padding:9px 12px;margin-bottom:12px;font-size:14px}
.g2r{display:grid;grid-template-columns:1fr 90px;gap:10px}
.rr2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.rr2 select{grid-column:1/-1}
.rg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.rg4 input{font-size:14px;padding:7px 6px;text-align:center}
[hidden]{display:none!important}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#0a0a0a;border-top:1px solid #262626;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
#nav button{flex:1;background:none;border:0;color:#9a9a9a;font:500 13px 'Barlow',sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 0}
#nav button.on{color:var(--accent)}
#nav svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.out #nav{display:none}
main{padding-bottom:110px}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1 id="ttl">⚡ Diario de entrenamiento</h1><button class="btn" id="new">+ Nuevo día</button></div>
  <div class="tabs" id="sub"><button class="tab" id="tEdit">Sesión</button><button class="tab" id="tList">Lista</button><button class="tab" id="tRec">Récords</button><span class="count" id="cnt"></span></div>
</header>
<div id="login" hidden></div>
<main id="app"></main>
<div id="modal"></div>
<nav id="nav"><button data-v="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Plan</button><button data-v="dia"><svg viewBox="0 0 24 24"><path d="M6 8v10M12 5v13M18 11v7"/></svg>Diario</button><button data-v="rev"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Revisiones</button><button data-v="cfg"><svg viewBox="0 0 24 24"><path d="M4 8h8M18 8h2M4 16h2M12 16h8"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>Ajustes</button></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
var role='cliente', tm=null;
firebase.initializeApp(window.FIREBASE_CONFIG);
var auth=firebase.auth(),fs=firebase.firestore();
try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
// Capa de datos: cada documento guarda el objeto de la app como JSON en "data"
// (Firestore no admite arrays anidados como las series [[reps,peso,…]]).
function okR(){return {error:null}}
function badR(e){return {error:e||true}}
function put(col,id,obj,extra){var o=extra||{};o.data=JSON.stringify(obj);o.updated_at=new Date().toISOString();return fs.collection(col).doc(id).set(o).then(okR,badR)}
function delDoc(col,id){return fs.collection(col).doc(id).delete().then(okR,badR)}
function getData(col,id){return fs.collection(col).doc(id).get().then(function(d){return d.exists&&d.data().data?JSON.parse(d.data().data):null})}
function listData(col,uid){return fs.collection(col).where('user_id','==',uid).get().then(function(q){return q.docs.map(function(d){return JSON.parse(d.data().data)})})}
var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var db={sessions:[],cur:null}, view='list', recF='';
try{document.documentElement.dataset.theme=localStorage.getItem('forja-tema')==='dark'?'dark':'light'}catch(e){}

var dirty={};
function save(){var s0=cur();if(s0&&role!=='coach')dirty[s0.id]=1;pend=true;clearTimeout(tm);tm=setTimeout(push,600)}
function chk(r){lastErr=!!(r&&r.error);if(lastErr)console.error(r.error)}
function push(){
  clearTimeout(tm);tm=null;
  if(!me){pend=false;return}
  if(role==='coach'){pend=false;if(target)put('plans',target,db.plan,{client_id:target}).then(chk);return}
  var ids=Object.keys(dirty);dirty={};
  // Con la caché offline la escritura queda guardada en local al instante
  ids.forEach(function(id){var s=null;for(var i=0;i<db.sessions.length;i++)if(db.sessions[i].id===id)s=db.sessions[i];if(s)put('sessions',s.id,s,{user_id:me.id,fecha:s.fecha||''}).then(chk)});
  pend=false;
}
function pad(n){return String(n).length<2?'0'+n:''+n}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(f){var p=(f||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null}
function safeImg(u){return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u||'')?u:''}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function blank(){
  var f=today(),d=parse(f),ex=[],i,j;
  for(i=0;i<8;i++){var s=[];for(j=0;j<5;j++)s.push(['','','','']);ex.push({n:'',l:'',s:s,notas:''})}
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),dia:DIAS[d.getDay()],fecha:f,hora:'',tipo:'',bloque:String(Math.floor(db.sessions.length/3)+1),meso:'',micro:'',ses:'',ex:ex,concl:'',t:Date.now()}
}
function cur(){for(var i=0;i<db.sessions.length;i++)if(db.sessions[i].id===db.cur)return db.sessions[i];return null}
function sorted(){return db.sessions.slice().sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'')||(b.hora||'').localeCompare(a.hora||'')||b.t-a.t})}
function newDay(){var s=blank();autoRoutine(s);db.sessions.push(s);db.cur=s.id;save();go('edit');window.scrollTo(0,0)}

function go(v){view=v;render();window.scrollTo(0,0)}
function fld(l,k,v,t,ex){return '<div><label>'+l+'</label><input '+(t||'type="text"')+' data-k="'+k+'" value="'+esc(v)+'" '+(ex||'')+'></div>'}

function render(){
  var app=document.getElementById('app'),n=db.sessions.length;
  document.getElementById('cnt').textContent=view==='list'?n+(n===1?' día':' días'):'';
  var TT={plan:'Plan',edit:'Diario',list:'Diario',rec:'Diario',rev:'Revisiones',cfg:'Ajustes'};document.getElementById('ttl').textContent='⚡ '+TT[view];
  var ns=document.querySelectorAll('#nav button');for(var q=0;q<ns.length;q++){var vv=ns[q].dataset.v;ns[q].className=((vv==='plan'&&view==='plan')||(vv==='dia'&&(view==='edit'||view==='list'||view==='rec'))||(vv==='cfg'&&view==='cfg')||(vv==='rev'&&view==='rev'))?'on':''}
  document.getElementById('sub').hidden=!(view==='edit'||view==='list'||view==='rec');
  document.getElementById('new').hidden=!(view==='edit'||view==='list')||role==='coach';
  document.getElementById('tEdit').className='tab'+(view==='edit'?' on':'');
  document.getElementById('tList').className='tab'+(view==='list'?' on':'');
  document.getElementById('tRec').className='tab'+(view==='rec'?' on':'');
  if(view==='rev')return renderRev();
  if(view==='rec')return renderRec();
  if(view==='cfg')return renderCfg();
  if(view==='plan')return renderPlan();
  if(view==='list'){
    var L=sorted();
    app.innerHTML=(role==='coach'?csel():'')+(L.length?'<div class="list">'+L.map(function(s){return '<div class="cw">'+card(s)+(isRO()?'':'<div><button class="del" style="color:var(--ink)" data-ddup="'+esc(s.id)+'">Duplicar</button><button class="del" data-dses="'+esc(s.id)+'">Borrar</button></div>')+'</div>'}).join('')+'</div>':'<div class="empty">No hay días guardados.</div>');
    return;
  }
  var s=cur();if(!s&&role==='coach'&&db.sessions.length){db.cur=sorted()[0].id;s=cur()}if(!s){if(role==='coach'){app.innerHTML=csel()+'<div class="empty">Sin sesiones.</div>';return}s=blank();db.sessions.push(s);db.cur=s.id;save()}
  var h=(role==='coach'?csel():'')+(function(){var m=notice;notice='';return m?'<div class="note">'+esc(m)+'</div>':''})()+'<div class="g3">'+fld('Día','dia',s.dia,'type="text"','placeholder="Lunes"')+fld('Fecha','fecha',s.fecha,'type="date"')+fld('Hora','hora',s.hora,'type="time"')+'</div>';
  h+='<div><label>Entrenamiento de:</label><select id="rutsel"><option value="">Elegir rutina…</option>'+rutOpts2(s)+'</select></div>';
  
  h+='<div class="g4">'+fld('Semana','bloque',s.bloque,'type="text" inputmode="numeric"')+fld('Meso','meso',s.meso)+fld('Micro','micro',s.micro)+fld('Sesión n.º','ses',s.ses,'type="text" inputmode="numeric"')+'</div>';
  h+='<div class="exs">';
  s.ex.forEach(function(e,i){
    h+='<div class="ex"><input class="exn" type="text" data-e="'+i+'" data-f="n" value="'+esc(e.n)+'" placeholder="Ejercicio '+(i+1)+'">';
    h+='<div class="lrow"><input type="text" inputmode="url" autocapitalize="none" data-e="'+i+'" data-f="l" value="'+esc(e.l)+'" placeholder="Enlace al ejercicio (vídeo, web…)"><a class="lk" id="lk'+i+'" target="_blank" rel="noopener noreferrer"'+(safeUrl(e.l)?' href="'+esc(safeUrl(e.l))+'"':' hidden')+'>Abrir ↗</a></div>';
    var pv=prevData(e.n,s);
    h+=(e.t&&tgtLine(e.t)?'<div class="pv"><span>Objetivo: '+tgtLine(e.t)+'</span></div>':'')+pv.html;
    h+='<table><thead><tr><th class="sn">Serie</th><th>Reps</th><th>Peso</th><th>RIR/RPE</th><th>Desc.</th></tr></thead><tbody>';
    e.s.forEach(function(r,j){h+='<tr'+(e.t&&+e.t.ns>0&&j>=+e.t.ns?' style="opacity:.4"':'')+'><td class="sn">'+(j+1)+'</td>'+r.map(function(v,c){return '<td><input type="text" inputmode="'+(c===3?'text':'decimal')+'" data-e="'+i+'" data-s="'+j+'" data-c="'+c+'" value="'+esc(v)+'" placeholder="'+esc(pv.last&&pv.last[j]?pv.last[j][c]:(c===0&&e.t&&e.t.rp?e.t.rp:''))+'" aria-label="Serie '+(j+1)+'"></td>'}).join('')+'</tr>'});
    h+='</tbody></table><textarea rows="1" data-e="'+i+'" data-f="notas" placeholder="Notas">'+esc(e.notas)+'</textarea></div>';
  });
  h+='</div><div class="concl"><label>Conclusiones</label><textarea data-k="concl" placeholder="Conclusiones de la sesión...">'+esc(s.concl)+'</textarea></div>';
  h+='<div class="foot"><button class="btn" id="add">+ Añadir otro día</button><button class="btn ghost" id="dup">Duplicar sesión</button><button class="del" id="del">Borrar sesión</button></div>';
  app.innerHTML=h;
  if(role==='coach'){app.querySelectorAll('input,textarea,#rutsel').forEach(function(x){x.disabled=true});document.getElementById('add').hidden=true;document.getElementById('del').hidden=true;document.getElementById('dup').hidden=true}
}
function card(s){
  var d=parse(s.fecha),fe=d?d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear():'Sin fecha';
  var names=s.ex.map(function(e){return e.n.trim()}).filter(Boolean);
  var chips=names.slice(0,3).map(function(x){return '<i>'+esc(x)+'</i>'}).join('');
  if(names.length>3)chips+='<i class="more">+'+(names.length-3)+'</i>';
  return '<button class="card" data-open="'+esc(s.id)+'"><div class="ct"><span>'+esc(fe)+(s.dia?' · '+esc(s.dia):'')+'</span><span>'+esc(s.hora||'')+'</span></div>'
   +'<div class="ty">'+(s.rut?'Rutina '+esc(s.rut)+' · ':'')+(s.tipo?esc(s.tipo):'<span style="color:var(--mute)">Sin tipo</span>')+'</div>'

  h+='<div class="g2">'+f('Cliente','cli')+f('Fecha de inicio','ini','date')+'</div>'+(P.ini?'<p class="lsub" style="margin:6px 0 0">'+wk(P.ini)+'</p>':'')+'<h3 class="sec">Objetivo del cliente</h3><div class="chips">'+GOALS.map(function(g,i){return '<button class="chip'+(P.obj.indexOf(g)>=0?' on':'')+'" data-goal="'+i+'"'+(co?'':' disabled')+'>'+g+'</button>'}).join('')+'</div>'+ta('Detalle de los objetivos','ot',4,'Ej.: bajar 6 kg de grasa en 12 semanas')+'<h3 class="sec">Objetivos de nutrición</h3><div class="g4">'+f('Calorías','kcal')+f('Proteína (g)','p')+f('Carbos (g)','c')+f('Grasas (g)','g')+'</div>'+ta('Notas de nutrición','nt',4)+rutBlock(P,co,ro);
  app.innerHTML=h;
}
var app=document.getElementById('app');
function onInput(ev){
  var t=ev.target,D=t.dataset;if(!D)return;
  if(D.ph){var f=t.files&&t.files[0],c4=getCk(revCur);if(!f||!c4)return;shrink(f,function(u){if(!u)return;c4.f[D.ph]=u;saveCk(c4);render()});return}
  if(D.cmp){if(D.cmp==='A')cmpA=t.value;else if(D.cmp==='B')cmpB=t.value;else cmpV=t.value;render();return}
  if(D.rv){var ck=getCk(revCur);if(!ck)return;var pp=D.rv.split('.');if(pp.length>1)ck[pp[0]][pp[1]]=t.value;else ck[pp[0]]=t.value;saveCk(ck);return}
  if(t.id==='rsel'){recF=t.value;render();return}
  if(t.id==='rutsel'){if(ev.type==='change'&&t.value&&t.value!=='__cur'){rutSel=t.value;loadRut()}return}
  if(t.id==='csel'){if(t.value===target)return;var ae=document.activeElement;if(ae&&ae!==t&&ae.blur)ae.blur();if(tm)push();target=t.value;loadTarget().then(function(){startLive();render()});return}
  if(D.r!==undefined){if(role!=='coach')return;var rr=db.plan.rutinas&&db.plan.rutinas[+D.r];if(!rr)return;if(D.x!==undefined){rr.ex=rr.ex||[];for(var q=0;q<8;q++)if(!rr.ex[q])rr.ex[q]={n:'',l:''};rr.ex[+D.x][D.f]=t.value}else rr[D.f]=t.value;save();return}
  if(D.p!==undefined){if(role!=='coach')return;db.plan[D.p]=t.value;save();return}
  var s=cur();if(!s)return;
  if(D.k){s[D.k]=t.value;if(D.k==='fecha'){var dd2=parse(t.value);if(dd2){s.dia=DIAS[dd2.getDay()];var di=app.querySelector('[data-k="dia"]');if(di)di.value=s.dia}}}
  else if(D.e!==undefined){var e=s.ex[+D.e];if(D.f){e[D.f]=t.value;if(D.f==='l'){var a=document.getElementById('lk'+D.e),u=safeUrl(t.value);if(a){if(u){a.href=u;a.hidden=false}else{a.removeAttribute('href');a.hidden=true}}}}else e.s[+D.s][+D.c]=t.value}
  else return;
  save();
}
app.addEventListener('input',onInput);
app.addEventListener('change',onInput);
app.addEventListener('click',function(ev){
  var c=ev.target.closest('[data-open]');
  if(c){db.cur=c.dataset.open;go('edit');return}
  if(ev.target.id==='add')newDay();
  if(ev.target.id==='del')askDel(function(){var did=db.cur;delSes(did);if(db.sessions.length)go('list');else{view='edit';render();window.scrollTo(0,0)}},'¿Borrar esta sesión? No se puede deshacer.');
  var tb=ev.target.dataset.th;
  if(tb){document.documentElement.dataset.theme=tb;try{localStorage.setItem('forja-tema',tb)}catch(e){}render()}
  var rt=ev.target.dataset.rt,orv=ev.target.closest('[data-orev]'),rph=ev.target.dataset.rph,drv=ev.target.dataset.drev;
  if(rt){revTab=rt;render()}
  if(orv){revCur=orv.dataset.orev;render();window.scrollTo(0,0)}
  if(ev.target.id==='revback'){revCur=null;render()}
  if(ev.target.id==='newrev'){var nc={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),fecha:today(),m:{},f:{},n:''};MED.forEach(function(m){nc.m[m[0]]=''});db.checkins.push(nc);revCur=nc.id;saveCk(nc);render();window.scrollTo(0,0)}
  if(rph){var c2=getCk(revCur);if(c2){c2.f[rph]='';saveCk(c2);render()}}
  if(drv)askDel(function(){delCk(drv);revCur=null;render()});
  var gi=ev.target.dataset.goal;
  if(gi!==undefined&&role==='coach'){var gl=GOALS[+gi],ix=db.plan.obj.indexOf(gl);if(ix>=0)db.plan.obj.splice(ix,1);else db.plan.obj.push(gl);save();render()}
  if(ev.target.id==='addrut'&&role==='coach'){var pr=db.plan;pr.rutinas=pr.rutinas||[];var ex8=[];for(var z=0;z<8;z++)ex8.push({n:'',l:''});pr.rutinas.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,4),nombre:'',ex:ex8});save();render()}
  var rrm=ev.target.dataset.rrm;
  if(rrm!==undefined&&role==='coach')askDel(function(){db.plan.rutinas.splice(+rrm,1);save();render()},'¿Quitar esta rutina del plan? Las sesiones ya creadas no cambian.','Quitar');
  var ds=ev.target.dataset.dses,dc=ev.target.dataset.dck,dr=ev.target.dataset.drec;
  if(ev.target.id==='dup')dupSes(db.cur);
  if(ev.target.dataset.ddup)dupSes(ev.target.dataset.ddup);
  if(ds)askDel(function(){delSes(ds);render()},'¿Borrar esta sesión? No se puede deshacer.');
  if(dc)askDel(function(){delCk(dc);render()});
  if(dr){var q2=dr.split('|');askDel(function(){clearEx(q2[0],+q2[1]);render()},'¿Borrar este registro? Se vacían las series de ese ejercicio en esa sesión y dejará de contar en los récords.')}
  if(ev.target.id==='out'){if(tm)push();flushCk();stopLive();auth.signOut().then(function(){me=null;showLogin()})}
  if(ev.target.id==='delacc')askDelAccount();
});
document.getElementById('new').onclick=newDay;
document.getElementById('tEdit').onclick=function(){if(!cur()&&db.sessions.length)db.cur=sorted()[0].id;go('edit')};
document.getElementById('tList').onclick=function(){go('list')};
document.getElementById('tRec').onclick=function(){go('rec')};
document.getElementById('nav').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;var v=b.dataset.v;if(v==='dia'){if(!cur()&&db.sessions.length)db.cur=sorted()[0].id;go(view==='list'||view==='rec'?view:'edit')}else go(v)};

function safeUrl(v){v=(v||'').trim();if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;try{var u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}}

var me=null,clients=[],target=null,user=null,loginEl=document.getElementById('login');
function loadTarget(){
  var id=role==='coach'?target:(me&&me.id);
  db.plan={cli:'',kcal:'',p:'',c:'',g:''};db.sessions=[];db.cur=null;db.checkins=[];
  if(!id)return Promise.resolve();
  return Promise.all([getData('plans',id).catch(function(){return null}),listData('sessions',id),listData('checkins',id)]).then(function(r){
    var pl=r[0];if(pl)db.plan=pl;
    db.sessions=r[1];db.checkins=r[2];
  });
}
function newCode(n){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',c='';for(var i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];return fs.collection('coachCodes').doc(c).get().then(function(d){if(!d.exists)return c;if(n>=4)throw {code:'code-gen'};return newCode(n+1)})}
function start(u,reg){
  var ref=fs.collection('profiles').doc(u.uid);
  return ref.get().then(function(d){
    if(d.exists)return d.data();
    if(!reg)throw {code:'no-profile'};
    var md=reg,p={id:u.uid,nombre:md.nombre||(u.email||'').split('@')[0],role:md.role==='coach'?'coach':'cliente',coach_id:md.coachId||null,email:u.email,created_at:new Date().toISOString()};
    function ins(){return ref.set(p).then(function(){return p})}
    if(p.role!=='coach')return ins();
    return newCode(0).then(function(c){p.coach_code=c;return fs.collection('coachCodes').doc(c).set({coachId:u.uid})}).then(ins);
  }).then(function(p){
    me=p;role=p.role==='coach'?'coach':'cliente';user=u.email;
    if(role!=='coach')return;
    return fs.collection('profiles').where('coach_id','==',me.id).get().then(function(q){clients=q.docs.map(function(x){return x.data()});target=clients.length?clients[0].id:null});
  }).then(loadTarget).then(function(){
    document.body.classList.remove('out');app.hidden=false;loginEl.hidden=true;loginEl.innerHTML='';
    if(role!=='coach'&&!db.sessions.length){var f=blank();db.sessions.push(f);db.cur=f.id;save()}
    view='plan';render();window.scrollTo(0,0);startLive();
  }).catch(function(e){
    console.error(e);
    if(e&&e.code==='no-profile'){auth.signOut();return showLogin('Tu cuenta no tiene perfil: el registro no terminó. Escríbenos a infoemtrainer@gmail.com.')}
    if(reg&&auth.currentUser)auth.currentUser.delete().catch(function(){});
    showLogin(reg?'No se pudo crear la cuenta. Inténtalo de nuevo.':'Error de conexión con el servidor.');
  });
}
var AUTHERR={'auth/email-already-in-use':'Ese correo ya tiene una cuenta. Pulsa «Entrar».','auth/invalid-email':'El correo no es válido.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/network-request-failed':'Sin conexión. Inténtalo de nuevo.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.'};
function showLogin(msg){
  user=null;me=null;document.getElementById('ttl').textContent='⚡ Diario de entrenamiento';document.body.classList.add('out');app.hidden=true;loginEl.hidden=false;
  loginEl.innerHTML='<div class="lg"><h2>Accede a tu diario</h2><p class="lsub">Entra con tu correo y contraseña.</p><label>Correo</label><input id="lu" type="email" autocomplete="username" autocapitalize="none" spellcheck="false"><div style="height:10px"></div><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password"><p class="lnote">Para crear una cuenta, rellena también lo de abajo:</p><label>Nombre</label><input id="ln" type="text" autocomplete="name"><div style="height:10px"></div><label>Tipo de cuenta</label><select id="lr"><option value="cliente">Cliente</option><option value="coach">Entrenador</option></select><div style="height:10px"></div><label>Código del entrenador (clientes)</label><input id="lc" type="text" autocapitalize="characters"><div class="lmsg" id="lm">'+esc(msg||'')+'</div><div class="lbtns"><button class="btn" id="bin">Entrar</button><button class="btn ghost" id="breg">Crear cuenta</button></div><p class="lnote"><button class="del" style="padding:0;color:var(--mute)" id="bfp">¿Olvidaste la contraseña?</button> · <a href="privacidad.html" target="_blank" rel="noopener" style="color:var(--mute)">Privacidad</a></p></div>';
  var lu=document.getElementById('lu'),lp=document.getElementById('lp'),lm=document.getElementById('lm');
  function say(t){lm.textContent=t}
  function doLogin(){
    var n=lu.value.trim().toLowerCase(),p=lp.value;
    if(!n||!p)return say('Escribe correo y contraseña.');
    say('');
    auth.signInWithEmailAndPassword(n,p).then(function(r){start(r.user)}).catch(function(e){say(AUTHERR[e.code]||'Correo o contraseña incorrectos.')});
  }
  function doReg(){
    var n=lu.value.trim().toLowerCase(),p=lp.value,role2=document.getElementById('lr').value,code=document.getElementById('lc').value.trim().toUpperCase(),nom=document.getElementById('ln').value.trim();
    if(!n||!p)return say('Escribe correo y contraseña.');
    if(p.length<6)return say('La contraseña debe tener al menos 6 caracteres.');
    if(role2==='cliente'&&!code)return say('Escribe el código que te dio tu entrenador.');
    say('Creando cuenta…');
    var chkCode=role2==='cliente'?fs.collection('coachCodes').doc(code).get().then(function(d){if(!d.exists)throw {code:'bad-code'};return d.data().coachId}):Promise.resolve(null);
    chkCode.then(function(cid){
      return auth.createUserWithEmailAndPassword(n,p).then(function(r){return start(r.user,{role:role2,nombre:nom,coachId:cid})});
    }).catch(function(e){say(e&&e.code==='bad-code'?'Ese código de entrenador no existe. Revísalo.':(AUTHERR[e&&e.code]||'No se pudo crear la cuenta.'))});
  }
  function doReset(){
    var n=lu.value.trim().toLowerCase();if(!n)return say('Escribe tu correo arriba y vuelve a pulsar.');
    auth.sendPasswordResetEmail(n).then(function(){say('Te hemos enviado un correo para cambiar la contraseña.')}).catch(function(e){say(AUTHERR[e.code]||'No se pudo enviar el correo.')});
  }
  document.getElementById('bin').onclick=doLogin;
  document.getElementById('breg').onclick=doReg;
  document.getElementById('bfp').onclick=doReset;
  loginEl.onkeydown=function(ev){if(ev.key==='Enter')doLogin()};
}
function askDelAccount(){
  var m=document.getElementById('modal');
  m.innerHTML='<div class="modal"><div class="box"><p>¿Borrar tu cuenta y todos tus datos? No se puede deshacer.</p><label>Escribe tu contraseña para confirmar</label><input id="dpw" type="password" autocomplete="current-password"><div class="lmsg" id="dmsg"></div><div class="r"><button class="btn ghost" id="no">Cancelar</button><button class="btn red" id="yes">Borrar cuenta</button></div></div></div>';
  document.getElementById('no').onclick=function(){m.innerHTML=''};
  document.getElementById('yes').onclick=function(){
    var u=auth.currentUser,pw=document.getElementById('dpw').value,dm=document.getElementById('dmsg');if(!u||!pw){dm.textContent='Escribe tu contraseña.';return}
    dm.textContent='Borrando…';
    stopLive();for(var id in tk)clearTimeout(tk[id]);tk={};clearTimeout(tm);dirty={};
    u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,pw)).then(function(){
      var uid=u.uid,jobs=['sessions','checkins'].map(function(c){return fs.collection(c).where('user_id','==',uid).get().then(function(q){return Promise.all(q.docs.map(function(d){return d.ref.delete()}))})});
      if(role!=='coach')jobs.push(fs.collection('plans').doc(uid).delete().catch(function(){}));
      if(me&&me.coach_code)jobs.push(fs.collection('coachCodes').doc(me.coach_code).delete());
      return Promise.all(jobs).then(function(){return fs.collection('profiles').doc(uid).delete()}).then(function(){return u.delete()});
    }).then(function(){m.innerHTML='';clearTimeout(tm);showLogin('Tu cuenta y tus datos se han borrado.')}).catch(function(e){console.error(e);dm.textContent=e&&e.code&&e.code.indexOf('password')>=0||e.code==='auth/invalid-credential'?'Contraseña incorrecta.':'No se pudo borrar. Inténtalo de nuevo.'});
  };
}

app.addEventListener('focusout',function(){setTimeout(function(){if(liveDirty&&!typingNow())liveRender()},0)});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(tm)push();flushCk()}});
window.addEventListener('pagehide',function(){if(tm)push();flushCk()});
var booted=false;auth.onAuthStateChanged(function(u){if(booted)return;booted=true;if(u)start(u);else showLogin()});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
